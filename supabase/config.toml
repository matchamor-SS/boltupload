# Supabase project settings used by `supabase functions deploy` / Bolt's Supabase integration.
project_id = "set-and-settled"

[functions.google]
verify_jwt = true
[functions.google-oauth-start]
verify_jwt = true
[functions.google-disconnect]
verify_jwt = true
[functions.account-delete]
verify_jwt = true
[functions.google-oauth-callback]
verify_jwt = false   # Google redirects the browser here; protected by the single-use, 10-minute `state` row instead
[functions.picker-config]
verify_jwt = false
